name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check backend/ --output-format=github

  dependency-audit:
    name: Dependency security audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          pip-audit -r backend/requirements.txt --output json > /tmp/audit.json
          python3 /tmp/audit.py || true
        shell: bash
      - name: Check results
        run: |
          python3 -c "
          import json, sys
          with open('/tmp/audit.json') as f:
              data = json.load(f)
          vulns = data.get('dependencies', [])
          IGNORE = {'PYSEC-2026-1325'}
          bad = []
          for v in vulns:
              if v.get('vulns'):
                  for vv in v['vulns']:
                      if vv['id'] not in IGNORE:
                          bad.append((v['name'], v['version'], vv['id']))
          if bad:
              print('VULNERABILITIES FOUND:')
              for name, ver, vid in bad:
                  print(f'  {name}=={ver}: {vid}')
              sys.exit(1)
          ignored = [v['name'] for v in vulns if v.get('vulns')]
          if ignored:
              print(f'Known unfixed vulnerabilities (ignored): {ignored}')
          print(f'All {len(vulns)} dependencies checked.')
          "

  validate-pages:
    name: Check all pages exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for page in index.html paths.html spirit.html garden.html founder.html story.html donate.html faq.html onboarding.html integrations.html legal.html; do
            if [ -f "frontend/public/$page" ]; then
              echo "✅ $page ($(wc -c < frontend/public/$page) bytes)"
            else
              echo "❌ MISSING: $page"
              exit 1
            fi
          done
          echo "✅ All pages present"
