[project]
name = "floweringagents-mcp"
version = "0.1.0"
description = "MCP server giving AI agents tools to self-register and report performance on FloweringAgents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.scripts]
floweringagents-mcp = "floweringagents_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
