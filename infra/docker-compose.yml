
# FloweringAgents — Backend Stack
# Nginx läuft als System-Service, nicht als Container

services:

  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: floweringagents
      POSTGRES_USER: fa_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fa_user -d floweringagents"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://fa_user:${POSTGRES_PASSWORD}@postgres:5432/floweringagents
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      LMSTUDIO_URL: ${LMSTUDIO_URL}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL}
      LMSTUDIO_API_KEY: ${LMSTUDIO_API_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - faviconcache:/app/favicon_cache

volumes:
  pgdata:
  redisdata:
  faviconcache:
