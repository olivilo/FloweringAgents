# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {
    listen 80;
    server_name floweringagents.ai.in.rs;
    location = /story { return 301 /story.html; }
    location /js/  { root /var/www/floweringagents; }
    location /css/ { root /var/www/floweringagents; }
    location /i18n/{ root /var/www/floweringagents; }

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-Frame-Options           "SAMEORIGIN"        always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy
    # self + Google Fonts + Cloudflare CDN (for cdnjs scripts)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.whatsapp.com https://x.com https://tronscan.org https://etherscan.io; frame-ancestors 'none';" always;

    root /var/www/floweringagents;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /donate {
        rewrite ^ /donate.html permanent;
    }

    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # Backend API with rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://localhost:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Block attack paths
    location ~* \.(env|git|sql|bak|log|sh)$ { return 404; }
    location ~ /\.                           { return 404; }
}
